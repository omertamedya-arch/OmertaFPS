<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        cursor: default;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
        opacity: var(--opacity, 0.9);
      }
    </style>
  </head>
  <body>
    <svg id="crosshair" viewBox="0 0 320 320" width="320" height="320" aria-hidden="true"></svg>
    <script src="./crosshair.js"></script>
  </body>
</html>
