name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # github.com release CDN'i 504 dondurdugunde indirmeyi surdurur; zip hash'i asagida resmi degerle dogrulanir.
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron and builder tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-${{ hashFiles('package-lock.json') }}-builder-tools

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron binary hash
        shell: pwsh
        run: |
          $expected = '489cd061908e697394b004298bf5ffd345c935d10e8ca197ba819f019ab2dec0'
          $zips = @(Get-ChildItem "$env:LOCALAPPDATA\electron\Cache" -Recurse -Filter 'electron-v45.2.3-win32-x64.zip' -ErrorAction SilentlyContinue)
          if ($zips.Count -eq 0) {
            Write-Host 'Onbellekte Electron zip yok; build adiminda indirilecek.'
            exit 0
          }
          foreach ($zip in $zips) {
            $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) {
              Remove-Item $zip.FullName -Force
              throw "Electron zip hash uyusmuyor: $actual"
            }
          }
          Write-Host 'Electron zip resmi hash ile dogrulandi.'

      - name: Verify tag, version and publish target
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw package.json | ConvertFrom-Json
          $tag = "${{ github.ref_name }}"
          if ("v$($pkg.version)" -ne $tag) {
            throw "Etiket ($tag) package.json surumu (v$($pkg.version)) ile eslesmiyor. Once surumu artirin, sonra etiketleyin."
          }
          if ($pkg.build.publish.owner -eq 'YOUR_GITHUB_USERNAME' -or $pkg.build.publish.repo -eq 'YOUR_REPO_NAME') {
            throw "package.json > build.publish icindeki owner/repo placeholder degerlerini gercek GitHub bilgileriyle degistirin."
          }

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Package and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npx electron-builder --win --publish always
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Deneme $i basarisiz, 20 sn sonra tekrar denenecek..."
            Start-Sleep -Seconds 20
          }
          exit 1
